<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Teguh Nugratama Dayuza — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070E"/>
      <stop offset="0.55" stop-color="#0F044C"/>
      <stop offset="1" stop-color="#0A1024"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CFC4B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7CFC4B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C6FFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4C6FFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="1090" cy="40" rx="380" ry="220" fill="url(#glowLime)"/>
  <ellipse cx="120" cy="340" rx="420" ry="200" fill="url(#glowBlue)"/>

  <!-- monogram -->
  <g opacity="0.28" fill="none" stroke="#7CFC4B" stroke-width="1.5">
    <circle cx="1030" cy="140" r="94"/>
    <circle cx="1030" cy="140" r="120" stroke-dasharray="2 10" stroke-opacity="0.55"/>
  </g>
  <text x="1030" y="184" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="120" font-weight="700" fill="#7CFC4B" fill-opacity="0.20" letter-spacing="-5">TD</text>

  <!-- content -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" letter-spacing="3.5" fill="#7CFC4B">
      <circle cx="75" cy="79" r="4" fill="#7CFC4B" stroke="none"/>
      <text x="92" y="84">FULL-STACK DEVELOPER / INDONESIA</text>
    </g>

    <text x="72" y="164" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Teguh Nugratama Dayuza</text>

    <text x="74" y="209" font-size="20" fill="#A9B4C6" font-weight="400">I design and build clean, reliable web &amp; mobile products.</text>

    <rect x="74" y="243" width="64" height="3" rx="1.5" fill="#7CFC4B"/>
    <rect x="144" y="243" width="320" height="1" fill="url(#fade)"/>

    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#7C889C">
      <text x="74" y="292">Java · Kotlin · JavaScript · C++ · PHP</text>
      <text x="74" y="316" fill="#5D6B82">Always learning, always shipping.</text>
    </g>

    <g transform="translate(880, 276)">
      <rect x="0" y="0" width="248" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="24" cy="20" r="4" fill="#7CFC4B"/>
      <text x="40" y="25" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#D7DEEA">yuza.vercel.app</text>
    </g>
  </g>
</svg>
