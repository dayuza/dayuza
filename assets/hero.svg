<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480" role="img" aria-label="just code">
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.05" fill="#FFFFFF"/>
    </pattern>

    <mask id="handMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="480">
      <rect width="1500" height="480" fill="#000000"/>
      <g fill="#FFFFFF">
        <!-- LEFT HAND (fingers point right) -->
        <g transform="translate(0,52) rotate(3 200 250)">
          <!-- forearm + palm -->
          <rect x="-230" y="150" width="210" height="176" rx="50"/>
          <rect x="-80" y="86" width="352" height="304" rx="100"/>
          <!-- thumb -->
          <g transform="rotate(-42 30 130)">
            <rect x="0" y="64" width="205" height="70" rx="35"/>
          </g>
          <!-- index -->
          <path d="M 250 100 C 400 93, 630 96, 682 112 Q 702 120, 682 134 C 630 150, 400 156, 250 164 Q 224 132, 250 100 Z"/>
          <!-- middle -->
          <path d="M 250 172 C 400 165, 652 168, 706 184 Q 726 192, 706 206 C 652 222, 400 228, 250 236 Q 224 204, 250 172 Z"/>
          <!-- ring -->
          <path d="M 250 244 C 400 237, 618 240, 672 256 Q 692 264, 672 278 C 618 294, 400 300, 250 308 Q 224 276, 250 244 Z"/>
          <!-- pinky -->
          <path d="M 250 316 C 385 310, 552 313, 596 327 Q 614 335, 596 347 C 552 361, 385 366, 250 372 Q 226 344, 250 316 Z"/>
        </g>

        <!-- RIGHT HAND (mirrored, slightly lower) -->
        <g transform="translate(1500,18) scale(-1,1)">
          <g transform="rotate(-5 700 240)">
            <rect x="-230" y="150" width="210" height="176" rx="50"/>
            <rect x="-80" y="86" width="352" height="304" rx="100"/>
            <g transform="rotate(-42 30 130)">
              <rect x="0" y="64" width="205" height="70" rx="35"/>
            </g>
            <path d="M 250 100 C 400 93, 620 96, 672 112 Q 692 120, 672 134 C 620 150, 400 156, 250 164 Q 224 132, 250 100 Z"/>
            <path d="M 250 172 C 400 165, 640 168, 694 184 Q 714 192, 694 206 C 640 222, 400 228, 250 236 Q 224 204, 250 172 Z"/>
            <path d="M 250 244 C 400 237, 610 240, 664 256 Q 684 264, 664 278 C 610 294, 400 300, 250 308 Q 224 276, 250 244 Z"/>
            <path d="M 250 316 C 380 310, 540 313, 584 327 Q 602 335, 584 347 C 540 361, 380 366, 250 372 Q 226 344, 250 316 Z"/>
          </g>
        </g>
      </g>
    </mask>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.08" stop-color="#FFFFFF"/>
      <stop offset="0.92" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="480">
      <rect width="1500" height="480" fill="url(#edgeFade)"/>
    </mask>

    <radialGradient id="softGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="480" fill="#08080A"/>
  <ellipse cx="750" cy="250" rx="520" ry="230" fill="url(#softGlow)"/>

  <g mask="url(#fadeMask)">
    <rect width="1500" height="480" fill="url(#dots)" mask="url(#handMask)" opacity="0.92"/>
  </g>

  <!-- wireframe window -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="1.5">
    <rect x="520" y="36" width="460" height="196"/>
    <line x1="520" y1="70" x2="980" y2="70" stroke-opacity="0.22"/>
    <circle cx="542" cy="53" r="4" stroke-opacity="0.55"/>
    <circle cx="560" cy="53" r="4" stroke-opacity="0.35"/>
    <circle cx="578" cy="53" r="4" stroke-opacity="0.2"/>
    <line x1="600" y1="112" x2="900" y2="112" stroke-opacity="0.16" stroke-dasharray="3 7"/>
  </g>

  <g fill="#FFFFFF" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace">
    <text x="960" y="57" text-anchor="end" font-size="12" fill-opacity="0.35">index.ts</text>
    <rect x="745" y="82" width="2" height="18" fill-opacity="0.7"/>
    <text x="542" y="214" font-size="11" fill-opacity="0.28">// build · ship · learn</text>
  </g>

  <!-- selection handles -->
  <g fill="#08080A" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5">
    <rect x="516" y="32" width="8" height="8"/>
    <rect x="976" y="32" width="8" height="8"/>
    <rect x="516" y="228" width="8" height="8"/>
    <rect x="976" y="228" width="8" height="8"/>
  </g>
</svg>
